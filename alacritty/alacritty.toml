# WINDOW SETTINGS
[window]
opacity = 1.0
dimensions = { columns = 90, lines = 25 }
padding = { x = 6, y = 0 }
dynamic_title = true
blur = true
resize_increments = true

# ENVIRONMENT
[env]
TERM = "xterm-256color"

# FONT CONFIGURATION
[font]
size = 10
normal = { family = "JetBrains Mono", style = "Normal" }

# CURSOR STYLE
[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.15

# INPUT CONFIGURATION
[keyboard]
bindings = [{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" }]

[mouse]
bindings = [{ mouse = "Right", mods = "Control", action = "Paste" }]

# COLOR SCHEME (DEFAULT KITTY THEME)
[colors]
primary = { background = "#000000", foreground = "#d0d0d0" }
cursor = { text = "#000000", cursor = "#d0d0d0" }
selection = { text = "#000000", background = "#fffacd" }
line_indicator = { background = "#add8e6", foreground = "#add8e6" }

# NORMAL COLORS (KITTY DEFAULT)
[colors.normal]
black = "#000000"
red = "#cc0403"
green = "#19cb00"
yellow = "#cecb00"
blue = "#0d73cc"
magenta = "#cb1ed1"
cyan = "#0dcdcd"
white = "#dddddd"

# BRIGHT COLORS (KITTY DEFAULT)
[colors.bright]
black = "#808080"
red = "#e5484d"
green = "#23fd00"
yellow = "#fffd00"
blue = "#1a8fff"
magenta = "#fd28ff"
cyan = "#14ffff"
white = "#ffffff"

# BELL NOTIFICATION
[bell]
animation = "Ease"
duration = 5
color = "#ffa500"  # Orange bell color

# TERMINAL BEHAVIOR
[terminal]
shell = { program = "/usr/bin/zsh" }
