# ================ HUAWEI MATEBOOK D16 (RLEF-XX) ================
# TLP 1.6.0 | Kernel 6.4+ | Ubuntu 24.04

# --- Critical Huawei Fixes ---
PCIE_ASPM_ON_AC="default"
PCIE_ASPM_ON_BAT="default"
RUNTIME_PM_DRIVER_BLACKLIST="nvme"
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
RESTORE_THRESHOLDS_ON_START=1

# --- CPU ---
CPU_SCALING_GOVERNOR_ON_AC="performance"
CPU_SCALING_GOVERNOR_ON_BAT="powersave"
CPU_ENERGY_PERF_POLICY_ON_AC="performance"
CPU_ENERGY_PERF_POLICY_ON_BAT="power"
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=70
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Disk (NVMe) ---
DISK_DEVICES="nvme0n1"       # CONFIRM WITH `lsblk`
DISK_APM_LEVEL_ON_AC=""      # Disable for NVMe
DISK_APM_LEVEL_ON_BAT=""     # Disable for NVMe
DISK_IOSCHED="none"          # Required for NVMe

# --- Power Management ---
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1          # Prevent BT drops

# --- Radio ---
WIFI_PWR_ON_AC=1
WIFI_PWR_ON_BAT=1            # Enable power saving
BLUETOOTH_ON_AC=1
BLUETOOTH_ON_BAT=1

# --- Thermal ---
SCHED_POWERSAVE_ON_AC=0
SCHED_POWERSAVE_ON_BAT=1

# --- Misc ---
TLP_ENABLE=1
WOL_DISABLE="Y"
